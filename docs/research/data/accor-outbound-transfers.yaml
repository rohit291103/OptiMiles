# ─────────────────────────────────────────────────────────────────────────────
# STAGED DATA — NOT SEEDED, NOT LOADED, NOT IN THE PIPELINE.
#
# This file lives under docs/research/data/ deliberately. It is NOT part of
# backend/seeds/catalog/ and nothing reads it. It exists so that when multi-hop
# transfer paths are introduced, this data is a straight lift rather than a
# re-research job.
#
# WHY IT IS NOT SEEDED: these are partner → partner links. The current schema
# (v1.1) models transfers as currency → partner, single hop only. Representing
# these rows requires a schema decision that has not been made — see
# ../accor-outbound-transfer-partners-v1.md §6.
#
# SCHEMA: mirrors backend/seeds/catalog/transfer_links.yaml so rows can be moved
# with minimal edits. ratio_from : ratio_to = points consumed : miles credited.
# The one difference is `partner_from` in place of `currency`.
#
# VERIFICATION: every row below was checked against Accor's own published
# conversion conditions on 2026-08-10 — a primary source, not an aggregator.
#   https://all.accor.com/a/en/loyalty-program/partners/conditions/airlines.html
# Rows NOT on that page are marked needs_verification: true and carry no ratio.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  captured_on: 2026-08-10
  verified_on: 2026-08-10
  primary_source: https://all.accor.com/a/en/loyalty-program/partners/conditions/airlines.html
  origin: >-
    Social infographics supplied by the user 2026-08-10, then verified against
    Accor's published conditions. The infographics' tier labels were wrong for
    Flying Blue, Qatar and Finnair; ratios below are Accor's, not theirs.
  accor_point_value_inr: "2.00"
  accor_point_value_note: >-
    USER DECISION 2026-08-10: value Accor points at ₹2.00/point for calculation
    purposes. NOTE this is a working assumption, NOT a guaranteed floor — the
    infographic's "₹2 guaranteed, no dynamic pricing" claim is wrong; Accor
    redemption value IS dynamic. There is no point-value field anywhere in the
    catalog schema today, so this has no seed home yet.

