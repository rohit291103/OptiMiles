# ── The Avios cluster ────────────────────────────────────────────────────────
# Avios is ONE currency shared across five programs. Movement between them is
# free and 1:1. This is why the multi-hop routes work at all, and it is the
# strongest argument for modeling Avios as a single reward currency with member
# programs rather than building general path search.
#
# TOPOLOGY CAVEAT: British Airways is the hub. Qatar and Finnair are NOT
# directly connected to Iberia — those moves route via BA in two stages. The
# "Combine My Avios" tool at avios.com hides this, but a path model must not.

avios_cluster:
  currency: avios
  hub: british-airways-executive-club
  members:
    - british-airways-executive-club
    - iberia-plus
    - qatar-privilege-club
    - finnair-plus
    - aer-lingus-aerclub
  movement:
    ratio_from: 1
    ratio_to: 1
    fee: none
    speed: usually instant, up to 24h
    direct_pairs_only_via_hub:
      - qatar-privilege-club
      - finnair-plus
  constraints:
    - All accounts must be in the same person's name with matching details.
    - Two-factor authentication required on every account involved.
    - Practical reports of BA<->Iberia linking failures persist despite matching
      details. Treat as real-world friction, not a guaranteed path.
  source: onemileatatime.com/guides/transfer-avios-between-accounts/; nerdwallet.com Avios transfer guide; headforpoints.com 2026-07-13
  verified_on: 2026-08-10
  needs_verification: false

# ── Worked example: why this matters ─────────────────────────────────────────
# Goal: Accor points -> Qatar Privilege Club Avios.
#
#   Modeled today (single hop):  accor-all -> qatar-privilege-club   @ 2:1
#   Real best route (2 hops):    accor-all -> iberia-plus            @ 1:1
#                                iberia-plus -> (BA) -> qatar        @ 1:1 free
#
#   10,000 Accor points  ->  5,000 Avios   (modeled)
#   10,000 Accor points  -> 10,000 Avios   (actual best)
#
# A single-hop optimizer recommends the route that destroys half the value. This
# is the exact failure mode OptiMILES exists to prevent, which is why the data is
# staged here rather than discarded.

