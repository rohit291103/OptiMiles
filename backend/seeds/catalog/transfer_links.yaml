- currency: hsbc-reward-points
  partner: krisflyer
  ratio_from: 1
  ratio_to: 1
  # VERIFIED 2026-11-06 on HSBC India's own pages. NB: search results for
  # "HSBC TravelOne KrisFlyer" are dominated by the SINGAPORE card (3:1 since
  # Jan 2025, 10,000-mile minimum blocks) — that is a different product and
  # none of its terms apply here.
  #   ratio   — rewards page partner table: Singapore Airlines, "Reward
  #             points equal to 1 mile": 1; product page "convert Reward points
  #             to Air Miles 1 to 1 in the app"
  #   minimum — "There is no minimum number of points required to redeem or
  #             transfer points." (was 1000 here, unsourced)
  #   fee     — "There are no handling charges for redemptions."
  #   timing  — "For most airlines, you can expect your redemption to be
  #             completed instantly or within 1 working day" (Singapore
  #             Airlines is not among the named slower exceptions — an
  #             inference; harmless to the engine, which rounds any 1–2 day
  #             delay to the same arrival month)
  min_transfer_points: 0
  transfer_fee_inr: 0
  processing_days_min: 0
  processing_days_max: 1
  notes: >-
    HSBC TravelOne (India) transfers 1:1 to Singapore Airlines KrisFlyer in the
    HSBC India app, with no minimum and no handling charge; most airline
    transfers complete instantly or within 1 working day.
  source: >-
    hsbc.bank.in TravelOne rewards page https://www.hsbc.bank.in/credit-cards/products/travelone/rewards/
    + "How to redeem credit card reward points"
    https://www.hsbc.bank.in/credit-cards/how-to-redeem-credit-card-reward-points/
    + TravelOne product page (2026-11-06)
  verified_on: 2026-11-06
  needs_verification: false

- currency: axis-edge-miles
  partner: krisflyer
  ratio_from: 1
  ratio_to: 2
  min_transfer_points: 500
  max_transfer_points: 30000
  transfer_fee_inr: 235
  processing_days_min: 1
  processing_days_max: 3
  notes: >-
    Group A hard cap — 30,000 EDGE Miles per calendar year, i.e. max 60,000
    KrisFlyer miles/year through this avenue. Ratio survived the Apr-2026
    devaluation (confirmed post-deval by rivo.pe + pointsmath). Fee ₹199+GST
    ≈ ₹235 per transfer (pointsmath) — VERIFY exact amount. NOTE: Atlas is
    discontinued for NEW applicants (2026) — existing holders keep benefits;
    flagged for Stage 7's one-new-card archetype.
  # RE-CHECKED 2026-11-06 — still secondary-only, so still flagged. The Axis
  # 2026-09-23 Travel EDGE reshuffle (Accor back, Air India / Flying Blue /
  # Qantas moved into Group A, Avios cut) left KrisFlyer in Group A at 1:2
  # with the 30,000 EDGE Miles/yr Atlas cap (cardexpress.in, checked against
  # the Travel EDGE portal 2026-09-23). Fee ₹199 + GST and a 500-EDGE-Mile
  # minimum are the consensus of secondary guides. Issuer pages could not be
  # read: the Travel EDGE T&C is rendered client-side and the old
  # axisbank.com/miles-transfer URL now redirects to a sitemap.
  source: >-
    pointsmath.com/axis-bank-transfer-partners (2026-06-21); rivo.pe Axis
    rewards guide 2026; cardexpress.in/articles/axis-edge-transfer-partners-group-a-group-b
    (2026-09-23); livefromalounge.com/axis-bank-travel-edge-rewards-reshuffle-2026/ ;
    research doc §1–2
  verified_on: 2026-11-06
  needs_verification: true

- currency: axis-edge-rewards
  partner: krisflyer
  ratio_from: 5
  ratio_to: 4
  min_transfer_points: 500
  max_transfer_points: 200000
  transfer_fee_inr: 235
  processing_days_min: 1
  processing_days_max: 3
  notes: >-
    MAGNUS BURGUNDY tier (replaces standard Magnus in this catalog per user
    scope decision 2026-07-04): 5:4 to Group A partners — double the standard
    Magnus 5:2. Group A cap 2,00,000 EDGE RP/calendar year (Group B 8L, 10L
    total across groups — only Group A modeled; KrisFlyer is Group A). Fee
    ₹199+GST ≈ ₹235 — VERIFY. Min transfer unconfirmed.
  # RE-CHECKED 2026-11-06 — still flagged.
  #   ISSUER-CONFIRMED: KrisFlyer is a Group A partner, and Group A is capped
  #   at "maximum of 2 lakh EDGE REWARD Points cumulatively" per calendar year
  #   (Axis "Revision of … MAGNUS for Burgundy … Terms & Conditions", w.e.f.
  #   2024-04-20, text extracted from axis.bank.in).
  #   SECONDARY ONLY: the 5:4 ratio. After the 2026-09-23 reshuffle,
  #   cardexpress.in still lists Burgundy at 5:4 with the 2L Group A cap, but
  #   some blogs report Burgundy cut to 5:2 for SOME partners (Avios, Accor) —
  #   no source reports a KrisFlyer change. The revision PDF does not state
  #   ratios, and the Travel EDGE T&C could not be read.
  source: >-
    Axis Magnus for Burgundy T&C revision (Group A membership + 2L cap)
    https://www.axis.bank.in/docs/default-source/default-document-library/credit-cards/magnus-for-burgundy-terms-and-conditions.pdf
    ; cardexpert.in Magnus Burgundy review (2025-01-18) + pointsmath.com Axis
    table (2026-06-21) + cardexpress.in Group A/B article (2026-09-23) for 5:4
  verified_on: 2026-11-06
  needs_verification: true

