- slug: axis-magnus-burgundy
  bank: Axis
  card_name: Magnus for Burgundy
  card_network: Visa
  currency: axis-edge-rewards
  annual_fee_inr: 30000
  joining_fee_inr: 30000
  base_earn_rate: "6.00"
  min_income_inr: null
  has_lounge_access: true
  notes: >-
    Replaces standard Magnus in this catalog (user scope decision
    2026-07-04). Eligibility is relationship-based (₹30L NRV with Axis
    Burgundy), not income-based — min_income left null. Welcome benefit is a
    ₹5,000 Yatra voucher (not points), so no welcome milestone row.
  source: cardexpert.in/axis-magnus-burgundy-credit-card-review (2025-01-18) — fee, rates, eligibility
  verified_on: 2026-07-04
  needs_verification: true
  # ANNUAL-FEE WAIVER (decision log 2026-11-02-fee-waiver-progress). Axis
  # excludes rent, wallet, utilities, government, EMI, cash, insurance, gold
  # and fuel MCCs from the threshold; only utilities and fuel exist in our
  # logging vocabulary, so those two are excluded structurally and the rest
  # are stated in `conditions` (a user logging rent as "other" would
  # overstate — the UI tells them not to).
  fee_waiver:
    kind: spend_based
    threshold_inr: 3000000
    threshold_comparison: at_least     # "Waived on eligible spends* of INR 30,00,000"
    window_kind: preceding_card_year   # "in preceding card anniversary year"
    waives_renewal_fee: true
    waives_joining_fee: false
    excluded_categories: [utilities, fuel]
    unmodelled_exclusions:
      - rent
      - wallet loads
      - government payments
      - EMI conversions
      - cash withdrawals
      - insurance
      - gold
      - reversals, fees and charges
    conditions: >-
      Only eligible spend counts: rent, wallet loads, utilities, government
      payments, EMI conversions, cash withdrawals, insurance, gold and fuel do
      not. Applies only while you keep the Burgundy relationship.
    source: >-
      Axis Bank MITC fee table: "MAGNUS FOR BURGUNDY Credit Card# 30,000#
      30,000# (Waived on eligible spends* of INR 30,00,000 in preceding card
      anniversary year)"; footnote *: threshold excludes "Rent (MCC -6513),
      Wallet (MCC- 6540), Utilities (MCC-4814,4816,4899,4900), Government
      Institutions …, EMI conversions, Cash withdrawals …" and, from 20 Apr
      2024, "Insurance …, Gold … and Fuel (MCC-5541, 5542, 5983)".
      https://www.axis.bank.in/docs/default-source/magnus-card/mitc-credit-cards.pdf
    verified_on: 2026-11-02
    needs_verification: false
  categories:
    - category_slug: default
      category_label: All spend (tiered 35/₹200 above ₹1.5L/month not modeled)
      earn_rate: "6.00"
      notes: >-
        12 EDGE RP per ₹200 = 6/₹100. Burgundy earns MORE (35/₹200) on spend
        beyond ₹1.5L/month — the schema models accelerated-up-to-cap, not
        accelerated-above-threshold, so the flat base rate is seeded and the
        tier upside is deliberately left on the table (under-promise).
      source: cardexpert.in Magnus Burgundy review — VERIFY current earn table
      verified_on: 2026-07-04
      needs_verification: true
    - category_slug: travel
      category_label: Travel EDGE portal (5X)
      # PORTAL-GATED (2026-11-07): Axis's accelerated-35 T&C grants "5X EDGE
      # Rewards on Travel EDGE" — bookings made through the Travel EDGE portal.
      # Direct bookings earn the 6.00 base rate. (Atlas, by contrast, also
      # earns its travel rate on direct airline/hotel bookings: not gated.)
      requires_portal: Axis Travel EDGE
      earn_rate: "30.00"
      monthly_cap_inr: 200000
      # over_cap_earn NOT issuer-sourced (2026-11-02): the Magnus for Burgundy
      # T&C PDF on axis.bank.in could not be text-extracted. Axis's
      # accelerated-35 T&C says Travel EDGE 5X "will be calculated on Base EDGE
      # Reward points", i.e. 5X is a multiple OF base, so base keeps accruing
      # past the bonus cap. Seeded base_rate on that reading; row stays
      # needs_verification: true.
      over_cap_earn: base_rate
      over_cap_earn_source: >-
        secondary: inference from Axis "terms-and-conditions-for-accelerated-35-edge-reward-points"
        ("5X EDGE Rewards on Travel EDGE ... calculated on Base EDGE Reward points");
        Burgundy T&C itself not read (2026-11-02)
      notes: >-
        60 RP/₹200 = 30/₹100 via Travel EDGE, capped at ₹2L/month spend
        (cardexpert "24% value-back up to ₹2L/month" at the 5:4 ratio).
        VERIFY the cap unit and whether direct airline spend qualifies.
        Above the cap spend is assumed to earn the 6.00 base rate — VERIFY.
      source: cardexpert.in Magnus Burgundy review (2025-01-18) — VERIFY post-Apr-2026
      verified_on: 2026-07-04
      needs_verification: true
    # ZERO-EARN ROW (2026-11-06). Issuer text, "Revision of Axis Bank MAGNUS
    # for Burgundy Credit Card Terms & Conditions" (w.e.f. 20 Apr 2024):
    # "spends done on Insurance, Gold & Fuel MCC will not be eligible for base
    # & accelerated EDGE REWARD Points" — Fuel 5541, 5542, 5983. Utilities are
    # NOT given a zero row: Axis's utilities exclusion we hold is worded for
    # the FEE-WAIVER threshold (MITC footnote), not for earning — a different
    # rule, and borrowing it would be a guess.
    - category_slug: fuel
      category_label: Fuel
      earn_rate: "0.00"
      notes: >-
        Fuel (MCC 5541, 5542, 5983) earns no base or accelerated EDGE Reward
        Points. Insurance and gold are also excluded but have no category here.
      source: >-
        Axis Bank Magnus for Burgundy T&C revision (effective 2024-04-20)
        https://www.axis.bank.in/docs/default-source/default-document-library/credit-cards/magnus-for-burgundy-terms-and-conditions.pdf
        (text extracted 2026-11-06)
      verified_on: 2026-11-06
      needs_verification: false
  milestones: []

