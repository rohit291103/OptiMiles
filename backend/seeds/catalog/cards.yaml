- slug: amex-platinum-travel
  bank: Amex
  card_name: Platinum Travel
  card_network: Amex
  currency: amex-mr
  annual_fee_inr: 5000
  joining_fee_inr: 3500
  base_earn_rate: "2.00"
  min_income_inr: 600000
  has_lounge_access: true
  source: research §1–2 (milestone-driven); rate confirmed by cardtrail.in Amex MR guide (2026-03-20, "1 MR per Rs 50")
  verified_on: 2026-07-04
  needs_verification: true
  categories:
    - category_slug: default
      category_label: All eligible spend
      earn_rate: "2.00"
      notes: 1 MR per ₹50 = 2.00/₹100 (confirmed 2026-07-04 web pass)
      source: cardtrail.in Amex MR India guide (2026-03-20)
      verified_on: 2026-07-04
      needs_verification: false
  milestones:
    - milestone_type: spend_bonus
      spend_threshold_inr: 190000
      bonus_points: 15000
      period: annual
      description: Annual milestone tier 1 — VERIFY thresholds; bonuses earned pre-March-2026 require manual claiming (research §1)
      source: research §2 "Amex Milestone Maximization" confirms structure; figures market knowledge
      verified_on: 2026-07-04
      needs_verification: true
    - milestone_type: spend_bonus
      spend_threshold_inr: 400000
      bonus_points: 25000
      period: annual
      description: Annual milestone tier 2 — VERIFY
      source: research §2 confirms structure; figures market knowledge
      verified_on: 2026-07-04
      needs_verification: true
  lounge_access:
    # MODELING NOTE: Amex states TWO limits — 8 visits a year AND at most 2 a
    # quarter. They are arithmetically consistent (2 x 4 = 8), but the
    # quarterly one is the binding constraint in any given period: you cannot
    # spend all 8 in one quarter. Seeding the quarterly limit is therefore the
    # more restrictive and the more useful reading, with the annual total
    # stated in conditions. Seeding "8 per year" would over-promise a traveller
    # planning a single trip.
    - program: issuer-direct
      scope: domestic
      visits_per_period: 2
      period: quarterly
      reset_anchor: calendar_quarter   # VERIFY: may be membership year quarters
      guest_visits_per_period: 0
      enrollment_required: false
      conditions: >-
        8 complimentary domestic visits a year, capped at 2 per quarter.
        Further visits are charged at Rs 750 each.
      source: americanexpress.com/in Platinum Travel Credit Card benefits pages (issuer primary source)
      verified_on: 2026-08-31
      needs_verification: true
    - program: priority-pass
      scope: international
      visits_per_period: 0             # membership is free; the VISITS are not
      period: annual
      reset_anchor: calendar_year
      guest_visits_per_period: 0
      enrollment_required: true
      # REVIEWER NOTE (not user-facing): seeded conservatively as zero
      # complimentary visits because the per-visit charge is not yet confirmed
      # against Amex T&C. If visits turn out to be included, raise the count —
      # do not lower a promise we already made.
      conditions: >-
        Your Priority Pass membership is free (Amex waives the USD 99 fee) for
        you and one supplementary cardmember — but that is the membership, not
        the visits. Check the per-visit charge before you travel.
      source: americanexpress.com/in Platinum Travel Credit Card benefits pages — per-visit charge NOT yet confirmed
      verified_on: 2026-08-31
      needs_verification: true

