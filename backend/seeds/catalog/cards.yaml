        earns 5 MR/₹100 up to 5,000 points a month and overseas spend earns
        3X — both left at this rate, so we under-state rather than over-state.
      source: >-
        American Express Membership Rewards Program T&C §III ("On the American
        Express Platinum Card, you earn 5 Membership Rewards Points for every
        Rs. 100 spent on Fuel* (capped at a maximum of 5000 Points every
        calendar month), and No Membership Rewards Points on spends at
        Insurance and Other Utility Services") + table ("1 MR point for every
        Rs. 40 spent") https://www.americanexpress.com/content/dam/amex/in/benefits/membership-rewards-terms.pdf
        ; product page "earn 1 Membership Reward points for every INR 40 spent"
        https://www.americanexpress.com/in/charge-cards/platinum-card/ (2026-11-06)
      verified_on: 2026-11-06
      needs_verification: false
    - category_slug: utilities
      category_label: Utilities
      earn_rate: "0.00"
      notes: Household electricity, gas and water providers earn no MR points.
      source: >-
        American Express Membership Rewards Program T&C §III table and
        footnote ^ https://www.americanexpress.com/content/dam/amex/in/benefits/membership-rewards-terms.pdf
        (2026-11-06)
      verified_on: 2026-11-06
      needs_verification: false
  milestones: []

# Deliberate negative case: cashback product, no transferable currency.
# Must yield ZERO KrisFlyer opportunities in Stage 5.
- slug: sbi-cashback
  bank: SBI
  card_name: Cashback
  card_network: Visa
  currency: sbi-cashback-inr
  annual_fee_inr: 999
  joining_fee_inr: 999
  base_earn_rate: "1.00"
  # NULLED 2026-11-06 (was 400000, "market knowledge"). SBI publishes no
  # income figure for this card in any document checked — the T&C ekit, the
  # MITC, or the 2026 reviews (1finance lists only age 21+ and income PROOF).
  # null = "not stated", the same as Amex Platinum Charge; a guessed bar
  # would be an invented number.
  min_income_inr: null
  # VERIFIED 2026-11-06: the 50-page CASHBACK SBI Card T&C ekit never
  # mentions lounge access (its feature list, FAQ and benefit clauses
  # included), and 2026 reviews report the last domestic visit was removed.
  # The product page's stale meta description is not the governing document.
  has_lounge_access: false
  # REVIEWER NOTE: fees (₹999 joining, ₹999 renewal) and the 1%/5% rates are
  # issuer-verified 2026-11-02; lounge (none) verified 2026-11-06 from the T&C.
  source: >-
    sbicard.com MITC https://www.sbicard.com/sbi-card-en/assets/docs/pdf/most-important-terms-and-conditions/mitc-english.pdf
    (fees) + CASHBACK SBI Card T&C https://www.sbicard.com/sbi-card-en/assets/docs/pdf/ekit-tncs/cashback-tnc-ekit.pdf
    (rates; no lounge benefit anywhere in it — re-read 2026-11-06) ;
    1finance.co.in SBI Cashback review 2026 (no lounge; no published income bar)
  verified_on: 2026-11-06
  needs_verification: false
  # ANNUAL-FEE WAIVER (decision log 2026-11-02-fee-waiver-progress). Renewal
  # fee only — the ₹999 joining fee carries no waiver in the MITC.
  fee_waiver:
    kind: spend_based
    threshold_inr: 200000
    threshold_comparison: at_least     # "Rs.2 Lakh or more"
    window_kind: days_365_before_fee_date
    waives_renewal_fee: true
    waives_joining_fee: false
    excluded_categories: []
    # Not modelled from third-party lists: SBI's own MITC and T&C say only
    # "eligible spends" and define them nowhere we could reach.
    unmodelled_exclusions:
      - anything SBI does not count as an eligible spend (not defined in the documents we checked)
    conditions: >-
      Eligible spends in the 365 days before your annual-fee billing date
      (shown on your statement). The joining fee is not waived.
    source: >-
      SBI Card MITC fee table: "CASHBACK SBI Card 999 999 (Waived off on annual
      spends of Rs.2 Lakh or more in the preceding year)"
      https://www.sbicard.com/sbi-card-en/assets/docs/pdf/most-important-terms-and-conditions/mitc-english.pdf
      ; Cashback T&C §13.2: "Eligible spends incurred on the Credit Card within
      the last 365 days from the Annual Card Fee billing date shall be
      considered for the spend-based reversal of the Annual Card fees."
      https://www.sbicard.com/sbi-card-en/assets/docs/pdf/ekit-tncs/cashback-tnc-ekit.pdf
    # REVIEWER NOTE: flagged — "eligible spends" undefined in both documents.
    verified_on: 2026-11-02
    needs_verification: true
  categories:
    - category_slug: default
      category_label: Offline spend (1% cashback)
      earn_rate: "1.00"
      # 200000 = ₹2,000 max offline cashback per statement cycle ÷ 1%.
      # Issuer (revision PDF, w.e.f. 1 Apr 2026): "The maximum Cashback that
      # can be earned in a statement cycle will be capped at ₹4,000, as
      # follows: ... Online 5% ₹2,000 ... 1% Offline (POS at Merchant Outlets)
      # ₹2,000". A MAXIMUM cashback means spend past it earns nothing.
      monthly_cap_inr: 200000
      over_cap_earn: nothing
      over_cap_earn_source: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/cashback-revised.pdf
      notes: >-
        1% on offline (POS) spend. Offline cashback is capped at ₹2,000 per
        statement cycle (= ₹2,00,000 of offline spend), after which offline
        spend earns NOTHING (over_cap_earn: nothing, since migration 0009).
        Fuel and utilities earn no cashback (own rows below). Insurance, rent,
        wallet loads, jewellery, education, railways and quasi-cash MCCs also
        earn none but have no category here, so they still fall to this row.
      source: >-
        CASHBACK SBI Card T&C §11.1(b) "Offline Spends 1%" + FAQ 12
        https://www.sbicard.com/sbi-card-en/assets/docs/pdf/ekit-tncs/cashback-tnc-ekit.pdf ;
        offline cap: SBI Card "Revision in the benefits of CASHBACK SBI Card"
        https://www.sbicard.com/sbi-card-en/assets/docs/pdf/cashback-revised.pdf
      verified_on: 2026-11-02
      needs_verification: false
    - category_slug: online
      category_label: Online spend (5% cashback)
      earn_rate: "5.00"
      # 40000 = ₹2,000 max online cashback per statement cycle ÷ 5%.
      # Revised from 100000 (pre-1-Apr-2026 ₹5,000 combined cap).
      monthly_cap_inr: 40000
      # Issuer: "Online 5% ... Max. Cashback ₹2,000" per statement cycle —
      # spend past ₹40,000 online earns nothing (NOT the 1% base rate).
      over_cap_earn: nothing
      over_cap_earn_source: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/cashback-revised.pdf
      notes: >-
        5% on online spend, max ₹2,000 cashback per statement cycle (from
        1 Apr 2026). Beyond ₹40,000 of online spend in a cycle the issuer pays
        NOTHING more (over_cap_earn: nothing, since migration 0009).
