- slug: hdfc-regalia-gold
  bank: HDFC
  card_name: Regalia Gold
  card_network: Visa
  currency: hdfc-rp-regalia
  annual_fee_inr: 2500
  joining_fee_inr: 2500
  base_earn_rate: "2.67"
  min_income_inr: 1200000
  has_lounge_access: true
  source: market knowledge (4 RP per ₹150 ≈ 2.67/₹100) — NOT in the research doc
  verified_on: 2026-07-04
  needs_verification: true
  categories:
    - category_slug: default
      category_label: All other spend
      earn_rate: "2.67"
      source: market knowledge — VERIFY
      verified_on: 2026-07-04
      needs_verification: true
  milestones: []
  lounge_access:
    # THE CASE MOST CARDHOLDERS GET WRONG: the visits are not granted, they
    # are earned by last quarter's spend. Someone who spent nothing last
    # quarter has zero visits this quarter, however premium the card.
    - program: issuer-direct
      scope: domestic
      visits_per_period: 3
      period: quarterly
      reset_anchor: calendar_quarter
      guest_visits_per_period: 0
      spend_gate_inr: 60000
      spend_gate_period: quarterly     # measured in the PRECEDING quarter
      enrollment_required: false
      conditions: >-
        Introduced in a mid-2026 revision that replaced a flat annual
        allowance — if you have held this card a while, the terms you
        remember are no longer the terms you have.
      source: cardexpert.in/hdfc-regalia-gold-2026-lounge-access-update (secondary) — VERIFY against HDFC T&C
      verified_on: 2026-08-31
      needs_verification: true
    - program: priority-pass
      scope: international
      visits_per_period: 6
      period: annual
      reset_anchor: calendar_year      # VERIFY: may be membership year
      guest_visits_per_period: 0
      enrollment_required: true
      conditions: >-
        6 international visits a year via Priority Pass, with no spend
        condition — unchanged by the 2026 domestic revision.
      source: cardexpert.in/hdfc-regalia-gold-2026-lounge-access-update (secondary) — VERIFY against HDFC T&C
      verified_on: 2026-08-31
      needs_verification: true

