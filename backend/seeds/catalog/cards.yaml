    needs_verification: false
  categories:
    - category_slug: default
      category_label: All other eligible spend
      earn_rate: "2.50"
      # VERIFIED 2026-11-06 against the Membership Rewards T&C, which also
      # CORRECTS the old note here ("fuel earns nothing" — wrong for this
      # card). The issuer table for The American Express Platinum Card:
      #   Fuel: "5 MR points for every Rs 100 spent" (capped 5,000 points per
      #     calendar month) · Insurance: "No MR points" · Other Utility
      #     Services: "No MR points" · Telecom and all other spends: "1 MR
      #     point for every Rs. 40 spent" · overseas (non-INR) spend: 3X.
      # Fuel is NOT given its own row: a capped row must state what spend past
      # the 5,000-point cap earns (CR-01) and the T&C does not say. Left on
      # this row it earns 2.50 instead of 5.00 — an under-statement up to
      # ₹2,00,000 of fuel a month, which is where 2.50% catches up with the
      # 5,000-point ceiling. 3X overseas is also not modelled (under-promise).
