# LOUNGE COVERAGE IS DELIBERATELY PARTIAL (CLAUDE.md -> tiered coverage).
# Only cards with a `lounge_access` block below have verified conditions; the
# rest are "not covered yet", which the product states plainly. A card's
# `has_lounge_access` boolean is the coarse fallback and stays until every
# card has real rows -- dropping it now would turn "we have not researched
# this" into the false claim "this card has no lounge access".
#
# WHY SO FEW ROWS: a 2026-08-31 research pass found the published figures for
# Atlas irreconcilable across sources (8/12/18 domestic by tier vs a flat
# 18 domestic + 12 international), Axis mid-year vendor switches, and search
# results for "HSBC TravelOne lounge" that describe HSBC's UK and Singapore
# products rather than the Indian card. Seeding those would have been
# invention. They are listed in the research brief instead.

# The 9 supported cards (mvp-scope-v2.md as amended by the 2026-07-04
# catalog-expansion decision: Magnus standard → Magnus Burgundy, Amex
# Platinum Charge added). earn rates are points per ₹100.
#
# SEEDING POLICY (decision-logged 2026-07-04): earn rates are seeded
# CONSERVATIVELY — every card gets a `default` category at its base rate;
# accelerated categories are added only where documented, so projections
# under-promise rather than over-promise. Caps are spend-INR per month.
# EVERY capped rule must state `over_cap_earn` (migration 0009, decision log
# 2026-11-02-cap-overflow-earn.md): `base_rate` = spend above the cap earns
# the card's base_earn_rate; `nothing` = it earns zero. It is sourced per row
# from the issuer's terms — validate_catalog CR-01 rejects a capped rule that
# leaves it out, because "beyond the cap earns base" was an assumption that
# overstated SBI Cashback. Uncapped rules must NOT carry it (CR-02).

- slug: hdfc-infinia
  bank: HDFC
  card_name: Infinia Metal
  card_network: Visa
  currency: hdfc-rp-premium
  annual_fee_inr: 12500
  joining_fee_inr: 12500
  base_earn_rate: "3.33"
  min_income_inr: 4800000
  has_lounge_access: true
  source: docs/research/singapore_airlines_krisflyer_indian_credit_card_research_v1.md §1 (5 RP per ₹150 ≈ 3.33/₹100); fee per db-schema-v1 example
  verified_on: 2026-07-04
  needs_verification: false
  # ANNUAL-FEE WAIVER (decision log 2026-11-02-fee-waiver-progress). Its own
  # provenance: reviewed separately from the card's fee and earn rate.
  fee_waiver:
    kind: spend_based
    threshold_inr: 1000000
    threshold_comparison: at_least     # "Spend Rs. 10,00,000" — met at the figure
    window_kind: preceding_card_year   # "Retail spends in preceding 12 months"
    waives_renewal_fee: true
    waives_joining_fee: false          # the first-year fee has a separate voucher offer, not a waiver
    excluded_categories: []
    # HDFC MITC (updated 29 Oct 2026) fee-table footnote: "* Exclude
    # transactions - Cash on Call, Balance Transfer, Cash Withdrawal". None is
    # a category we log, so all three are unmodelled.
    unmodelled_exclusions: [Cash on Call, balance transfers, cash withdrawals]
    conditions: >-
      Retail spends in the 12 months before your renewal; HDFC excludes Cash on
      Call, balance transfers and cash withdrawals. HDFC also words the window
      as "12 billing cycles of your anniversary year", so counts near the start
      of the window may differ from HDFC's by a few days.
    source: >-
      HDFC Bank credit card fee-waiver page ("Pricing MID for Oct 2026"), table
      column "RENEWAL FEE WAIVER (Retail spends in preceding 12 months)", row
      "Infinia Metal Card Rs. 12,500 … Spend Rs. 10,00,000"; T&C: "Renewal Fee shall be levied at
      the start of every anniversary year if the card … does not meet Renewal
      fee waiver condition". https://www.hdfcbank.com/personal/pay/cards/credit-cards/credit-card-fee-waiver-condition
      ; HDFC MITC "Minimum Spend for waiver of annual membership fee / renewal
      charges for next year *" + footnote "* Exclude transactions - Cash on
      Call, Balance Transfer, Cash Withdrawal" https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/personal-mitc/mitc-in-english.pdf
      ; Regalia Gold fees page "Retail spends of ₹4 lakh within 12 billing
      cycles of your anniversary year".
    # REVIEWER NOTE: flagged because the billing-cycle wording leaves the
    # window's alignment to the renewal unstated — the month-only subset
    # proof (periods.renewal_window) is not established for HDFC.
    verified_on: 2026-11-02
    needs_verification: true
  categories:
    - category_slug: default
      category_label: All other spend
      earn_rate: "3.33"
      source: research §1 base rate
      verified_on: 2026-07-04
      needs_verification: false
    - category_slug: travel
      category_label: Travel via SmartBuy portal
      # PORTAL-GATED (2026-11-07): the 5X/10X applies to flights and hotels
      # BOOKED ON SMARTBUY. hdfc.bank.in Diners Club Black Metal page:
      # "Hotels booked via SmartBUY earn 10X points, and flights booked via
      # SmartBUY earn 5X points." Booked directly with an airline the same
      # spend earns the 3.33 base rate. Best Card prices both.
      requires_portal: HDFC SmartBuy
      earn_rate: "16.65"
      # CAP UNIT CORRECTED 2026-11-06. HDFC caps SmartBuy BONUS points, not
      # spend: Infinia 15,000 bonus RP per calendar month (daily cap removed;
      # gift vouchers carry a 3,000 RP sub-cap inside it from 2026-07-01).
      # The old ₹1,50,000 figure read the 1.5L-RP REDEMPTION ceiling as an
      # earn cap. Converted to spend at the seeded 5X (flights) rate:
      #   5X = 25 RP per ₹150, of which 20 RP per ₹150 is bonus
      #   15,000 bonus RP ÷ 20 × ₹150 = ₹1,12,500 of spend per month.
      # Hotels earn 10X and hit the points cap sooner (₹50,000), but this row
      # also earns only 5X on them, so for any spend it never overstates:
      # below ₹1,12,500 it earns less than the real 10X, and above it both
      # land on base rate + the same 15,000 bonus RP.
      # FRAGILE MARGIN: that last step holds only because 16.65 and 3.33 are
      # rounded DOWN from the true 25/150 and 5/150 (at the cap: seeded 18,731
      # vs real 18,745 RP). Never round either rate up.
      monthly_cap_inr: 112500
      # over_cap_earn NOT issuer-sourced: hdfcbank.com / offers.smartbuy
      # return 403 to automated fetches (re-tried 2026-11-06). Secondary
      # sources agree the cap binds only the bonus, so base keeps accruing
      # (cardadvisor: caps "apply only to the bonus (extra) reward points").
      over_cap_earn: base_rate
      over_cap_earn_source: >-
        secondary: https://insideflyer.com/posts/hdfc-caps-voucher-rewards-at-3-000-points-monthly/ ;
        https://magnify.club/guides/hdfc-smartbuy-gift-voucher-points-cap (2026-11-02) ;
        https://cardadvisor.in/articles/hdfc-smartbuy-guide (2026-11-06)
      notes: >-
        5X of base via SmartBuy flights; hotels earn 10X but 5X is seeded
        conservatively. HDFC caps the BONUS at 15,000 RP per calendar month,
        seeded as the equivalent ₹1,12,500 of 5X spend. Above that, spend keeps
        earning the 3.33 base rate (secondary sources; HDFC's SmartBuy T&C was
        unreachable).
      source: >-
        cap: livefromalounge.com SmartBuy voucher-cap article (2026-07-01,
        "Infinia / Infinia Metal 15,000 pts" overall, unchanged) +
        cardadvisor.in/articles/hdfc-smartbuy-guide (Infinia 15,000 RP, flights
        5X, hotels 10X, calendar-month reset) — both secondary; multiplier:
        docs/research/...krisflyer...research_v1.md §1–2
      verified_on: 2026-11-06
      needs_verification: true
  milestones: []
  lounge_access:
    - program: issuer-direct
      scope: domestic
      visits_per_period: null          # unlimited
      period: annual
      reset_anchor: not_applicable     # nothing to reset when it is unlimited
      guest_visits_per_period: null    # guests are admitted complimentary
      enrollment_required: false
      conditions: >-
        Swipe the Infinia card at the desk. HDFC charges Rs 2 per
        complimentary visit for Visa cardholders.
      source: HDFC "Airport Lounge Access Program" T&C PDF, effective 2026-07-02
      verified_on: 2026-08-31
      needs_verification: false
    - program: priority-pass
      scope: international
      visits_per_period: null          # unlimited for the Priority Pass holder
      period: annual
      reset_anchor: not_applicable
      guest_visits_per_period: 0       # zero complimentary, NOT unlimited
      enrollment_required: true
      conditions: >-
        Complimentary only for primary and add-on holders presenting their OWN
        Priority Pass card; the Priority Pass card itself must be presented at
        the lounge. Guests are charged USD 27 + GST per visit. An add-on holder
        without their own Priority Pass is treated as a guest.
      source: HDFC "Airport Lounge Access Program" T&C PDF, effective 2026-07-02
      verified_on: 2026-08-31
      needs_verification: false

