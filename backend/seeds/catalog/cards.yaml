- slug: hsbc-travelone
  bank: HSBC
  card_name: TravelOne
  card_network: Visa
  currency: hsbc-reward-points
  annual_fee_inr: 4999
  joining_fee_inr: 4999
  base_earn_rate: "2.00"
  # CORRECTED 2026-11-06 (was 1,500,000 — not on any issuer page). HSBC:
  # "minimum income of INR600,000 per year for salaried individuals" and
  # "INR12,00,000 per year for self-employed individuals". The lower,
  # salaried figure is seeded because it is the card's actual entry bar.
  min_income_inr: 600000
  has_lounge_access: true
  source: >-
    hsbc.bank.in TravelOne product page (fee ₹4,999; income ₹6L salaried /
    ₹12L self-employed) https://www.hsbc.bank.in/credit-cards/products/travelone/
    (2026-11-06); magnify.club review 2026
  verified_on: 2026-11-06
  needs_verification: false
  # ANNUAL-FEE WAIVER (decision log 2026-11-02-fee-waiver-progress).
  # STRICT: "exceeds ₹800,000" — exactly ₹8,00,000 does not qualify.
  fee_waiver:
    kind: spend_based
    threshold_inr: 800000
    # CONSERVATIVE: the service guide says "exceeds ₹800,000"; the KFS says
    # "Waived off for annual spends of ₹800,000 or more". The issuer's own
    # documents disagree, so the stricter reading is seeded (it can only make
    # a REACHED harder to prove) and the row is flagged.
    threshold_comparison: more_than
    window_kind: current_card_year     # the fee charged for a card year is reversed by spend IN that year
    waives_renewal_fee: true           # "Annual fees second year onwards"
    waives_joining_fee: true           # "Standard Annual fees for the first year" — same reversal
    excluded_categories: []
    unmodelled_exclusions:
      - anything HSBC does not treat as eligible spend (not defined in the documents we checked)
    conditions: >-
      The annual fee, including GST, is fully reversed when eligible spend on
      the primary and add-on cards during that anniversary year exceeds
      ₹8,00,000. Add-on spend counts, so log it against this card too.
      During your renewal month we show the card year that has just closed —
      it decides whether the fee charged at its start is reversed. The year
      now beginning becomes the one we track once that month is over.
    source: >-
      HSBC TravelOne service guide (Most Important Terms and Conditions and
      Tariff Sheet): "Annual fees second year onwards (The annual fee including
      applicable GST will be fully reversed if total eligible spend across the
      primary and add-on cards during the relevant anniversary year exceeds
      ₹800,000)" and the identical clause for "Standard Annual fees for the
      first year".
      https://www.hsbc.co.in/content/dam/hsbc/in/documents/aw-travel-one-sevice-guide-11-12-2025.pdf
      ; KFS: "Travel One … ₹4,999 (Waived off for annual spends of ₹800,000 or
      more)" https://www.hsbc.co.in/content/dam/hsbc/in/documents/credit-card-key-fact-statement.pdf
      ; product page (2026-11-06): "free if you spend more than INR 800,000 a
      year" https://www.hsbc.bank.in/credit-cards/products/travelone/
    # REVIEWER NOTE: flagged — "eligible spend" is still not defined for the
    # fee reversal in any HSBC document checked. On strict vs inclusive, two
    # of three issuer documents (service guide, product page) now say "more
    # than", so the seeded strict reading is the majority wording too.
    verified_on: 2026-11-06
    needs_verification: true
  categories:
    - category_slug: default
      category_label: All other spend
      earn_rate: "2.00"
      notes: 2 RP/₹100, uncapped (confirmed 2026-07-04 web pass)
      source: hsbc.co.in TravelOne rewards page; magnify.club TravelOne review 2026
      verified_on: 2026-07-04
      needs_verification: false
    - category_slug: travel
      category_label: Flights, travel aggregators and foreign-currency spend
      earn_rate: "4.00"
      # CAP ADDED 2026-11-06 — this row previously said "uncapped" and was
      # marked verified. HSBC's own service guide caps it per calendar month:
      #   §2b "2X Reward Points … subject to a maximum capping of 50,000
      #   reward points in a calendar month"
      #   Rewards Programme §2 "maximum capping of 50,000 accelerated reward
      #   points in a calendar month … after reaching capping of 15,000
      #   accelerated reward points"   ← same paragraph, two numbers
      #   §6 "Accelerated Reward Points i.e 4 RP for every INR 100 Spends"
      # So the cap counts all 4 RP. The guide gives 50,000 twice and 15,000
      # once; the STRICTER reading is seeded (same precedent as this card's
      # fee waiver) and the row is flagged until HSBC resolves it:
      #   15,000 RP ÷ 4 RP per ₹100 = ₹3,75,000 of spend per month
      #   (the 50,000 reading would be ₹12,50,000).
      monthly_cap_inr: 375000
      # ISSUER-SOURCED: "Credit cardholder will earn reward points at the
      # regular earn rate of 2 reward points for every purchase of ₹100 after
      # reaching capping".
      over_cap_earn: base_rate
      # (service guide §2b and Rewards Programme §2 — quoted above)
      over_cap_earn_source: https://www.hsbc.co.in/content/dam/hsbc/in/documents/aw-travel-one-sevice-guide-11-12-2025.pdf
      notes: >-
        4 RP/₹100 on airlines (listed MCCs) and travel aggregators (MCC 4111,
        4131, 4722, 4723) and foreign-currency spend. HSBC caps these points
        per calendar month and its guide gives two figures (50,000 and 15,000
        points); the lower is seeded, as ₹3,75,000 of spend. Above it, spend
        earns the 2 RP base rate.
      source: >-
        HSBC TravelOne service guide (MITC, dated 11-12-2025)
        https://www.hsbc.co.in/content/dam/hsbc/in/documents/aw-travel-one-sevice-guide-11-12-2025.pdf
        ; product page "Earn 4 reward points for every INR100 spent on flights,
        travel aggregators and in foreign currency"
        https://www.hsbc.bank.in/credit-cards/products/travelone/ (2026-11-06)
      verified_on: 2026-11-06
      needs_verification: true
    # Zero-earn labels are deliberately NEUTRAL ("Fuel", not "Fuel (earns
    # nothing)"): Portfolio can name a category by any card's rule label, and
    # an "earns nothing" heading above another card's winning rate would lie.
    # The 0.00 rate and the notes carry the fact.
    # ZERO-EARN ROWS (2026-11-06). Without them fuel and utility spend fell to
    # the `default` row and earned 2 RP it never earns. Issuer text, service
    # guide: "No reward points will be earned for spends in the below
    # categories: Utilities(4900) … Fuel(5541,5542, 5172,5983,5552) …". The
    # rest of that list (insurance, wallets, rent, tax, education/government,
    # jewellery, money transfer) has no category in our vocabulary — those
    # still fall to `default` and are listed here so the gap is visible.
    - category_slug: fuel
      category_label: Fuel
      earn_rate: "0.00"
      notes: HSBC excludes fuel MCCs 5541, 5542, 5172, 5983, 5552 from reward points.
      source: >-
        HSBC TravelOne service guide, Rewards Programme §4
        https://www.hsbc.co.in/content/dam/hsbc/in/documents/aw-travel-one-sevice-guide-11-12-2025.pdf
      verified_on: 2026-11-06
      needs_verification: false
    - category_slug: utilities
      category_label: Utilities
      earn_rate: "0.00"
      notes: >-
        HSBC excludes utilities (MCC 4900) from reward points. Also excluded
        but not modelled (no category): insurance, e-wallets, rent/real estate,
        tax, education & government, jewellery, money transfer.
      source: >-
        HSBC TravelOne service guide, Rewards Programme §4
        https://www.hsbc.co.in/content/dam/hsbc/in/documents/aw-travel-one-sevice-guide-11-12-2025.pdf
      verified_on: 2026-11-06
      needs_verification: false
  milestones:
    # ADDED 2026-11-06 — was missing. Primary card only; add-on spend is not
    # separately eligible ("Add-on credit Cardholders will not have separate
    # Offer eligibility"). HSBC calls it a "limited period Offer" and states
    # NO end date — re-check this row on every seed pass.
    # WHAT COUNTS (§8): "Eligible transaction refers to all types of sales
    # transactions (including but without limitation, bill payments, online
    # purchases, mail and telephone orders and insurance payments)", excluding
    # finance charges, cash advances, late fees, balance transfers and annual
    # fees. So fuel and utility spend COUNTS toward ₹12L even though it earns
    # no points — the projector's all-spend accumulation matches HSBC here.
    - milestone_type: spend_bonus
      spend_threshold_inr: 1200000
      bonus_points: 10000
      period: annual                     # "anniversary year … from the … account open date"
      description: >-
        10,000 bonus reward points on ₹12L net eligible spend in a card
        anniversary year (primary card). HSBC describes it as a limited-period
        offer.
      source: >-
        HSBC "TravelOne Credit Card: Terms and Conditions for Milestone Offer"
        §4 ("Cardholders who make Net Eligible spend of ₹12,00,000 in an
        anniversary year … will be eligible for additional 10,000 reward
        points") https://www.hsbc.bank.in/content/dam/hsbc/in/documents/milestone-benefits-2-tnc.pdf
        (2026-11-06)
      verified_on: 2026-11-06
      needs_verification: false

