      source: >-
        SBI Card "Revision in the benefits of CASHBACK SBI Card", w.e.f. 1 Apr 2026
        https://www.sbicard.com/sbi-card-en/assets/docs/pdf/cashback-revised.pdf ;
        T&C FAQ 12 https://www.sbicard.com/sbi-card-en/assets/docs/pdf/ekit-tncs/cashback-tnc-ekit.pdf
      verified_on: 2026-11-02
      needs_verification: false
    # ZERO-EARN ROWS (2026-11-06). CASHBACK SBI Card T&C exclusion list:
