    invitation/relationship-based eligibility (min_income null). Welcome
    benefit is ₹60,000 in hotel vouchers (Taj/Postcard), not points — no
    welcome milestone row. Shares the amex-mr currency with Platinum Travel
    (same MR program, same transfer entitlements).
  # Annual fee and earn rate re-confirmed on the issuer page 2026-11-06. Stays
  # flagged ONLY for joining_fee_inr: the page states the annual fee ("INR
  # 66,000 plus applicable taxes") but not a joining/first-year fee.
  source: >-
    americanexpress.com/in/charge-cards/platinum-card (fee ₹66,000; 1 MR/₹40;
    applications paused) https://www.americanexpress.com/in/charge-cards/platinum-card/
    (2026-11-06)
  verified_on: 2026-11-06
  needs_verification: true
  # ANNUAL-FEE WAIVER: a sourced NO. The ₹20L-spend provision is a renewal
  # BENEFIT (vouchers) paid only AFTER the renewal fee is paid — it is not a
  # waiver and must never be modelled as one.
  fee_waiver:
    kind: none
    conditions: >-
      No spend-based fee waiver. Spending ₹20 lakh in a membership year earns
      renewal vouchers worth up to ₹35,000 — but only once the renewal fee is
      paid, so the fee itself is never waived.
    source: >-
      americanexpress.com Platinum Card page: "On spends on INR 20 Lakhs in
      membership year and payment of renewal fee, get vouchers upto INR 35,000
      as renewal benefit"; "Annual Fee: INR 66,000 plus applicable taxes".
