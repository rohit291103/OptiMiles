  annual_fee_inr: 66000
  joining_fee_inr: 66000
  base_earn_rate: "2.50"
  min_income_inr: null
  has_lounge_access: true
  # CLOSED TO NEW APPLICANTS (user decision 2026-11-02): the issuer page says
