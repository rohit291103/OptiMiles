# KrisFlyer award chart — MVP routes × cabins (one-way, per passenger).
#
# 2026-07-04 web-verification pass: values updated to the post-1-Nov-2025
# Saver chart, Zone 6 ("India, Sri Lanka, Maldives, Bangladesh"), from the
# suitesmile.com chart dump (2026-03-28). The official singaporeair.com PDF
# was not fetchable at verification time, and one secondary source
# (pointsmax.in) quotes 46,000 for DEL→SIN business vs the zone table's
# 45,000 — so every row stays needs_verification until checked against the
# live chart. These REPLACE the old db-schema-v1 example values, which were
# materially wrong (35,000 vs 45,000 business to SEA; 84,500 vs 117,000 to
# North America).
#
# 2026-11-06 re-check (all rows stay needs_verification — singaporeair.com's
# chart pages 404 to automated fetches and the official PDF was not found):
# - India ↔ Singapore Saver 19,000 / 45,000 / 61,500 (Y / J / F) re-confirmed
#   on the same chart dump ("India ↔ Singapore") and by cardexpress.in's
#   points planner ("Business Saver is 45,000 miles … same from every city in
#   India", citing the 1-Nov-2025 chart). These rows are labelled "Southeast
#   Asia" but the figures are India ↔ SINGAPORE specifically.
# - SOURCE DEFECT in the Europe and North America rows: the suitesmile chart
#   prices ONLY routes to/from Singapore. 108,500 (Zone 11 Europe) and
#   117,000 (Zone 13 US East) are SINGAPORE-origin Saver prices, not India-
#   origin. pointsmax.in separately claims 108,500 for India→Europe via SIN
#   (secondary, unverified); no source was found for India→US. Values are
#   left as-is rather than replaced with a guess, and the rows are annotated.
# - The 2026-03-26 "Saver awards gone" scare (suitesmile) was an inventory
#   blip — availability was restored within days; the 2026-03-28 change
#   devalued ACCESS awards only, not Saver.
#
# Maharaja Club rows are deliberately ABSENT: no verified data yet, and an
# absent row fails honestly as "unsupported route" while a wrong row lies.
# Hotel partners (Marriott/Accor) have no award-chart rows by design —
# hotel redemptions are not chart-priced flights.

